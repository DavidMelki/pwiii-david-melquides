spring.application.name=biblioteca-api

# Banco de dados (pode ser sobrescrito por variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=${PORT:8080}

# CORS: origens permitidas, separadas por vírgula
app.cors.origens=${CORS_ORIGENS:*}

# Swagger UI em /swagger
springdoc.swagger-ui.path=/swagger
